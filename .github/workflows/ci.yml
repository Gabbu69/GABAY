name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gabay
          POSTGRES_PASSWORD: gabay
          POSTGRES_DB: gabay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gabay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GABAY_PROFILE: test
      GABAY_SECRET_KEY: ci-only-secret-not-for-production-0123456789-abcdef-ABCDEF
      GABAY_DATABASE_URL: postgresql://gabay:gabay@127.0.0.1:5432/gabay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          GABAY_PROFILE: production
          GABAY_ALLOWED_HOSTS: localhost
      - run: ruff check .
      - run: coverage run -m pytest
      - run: coverage report
      - run: python manage.py collectstatic --noinput

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          .\scripts\build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GABAY-Windows-x64-Lite
          path: |
            dist/GABAY-Windows-x64-Lite.zip
            dist/GABAY-Windows-x64-Lite.zip.sha256
