[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gabay-thesis"
version = "0.1.0"
description = "GABAY palay price forecasting and explainable decision support for M'lang, Cotabato"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24; platform_system != 'Windows'",
  "numpy>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "scipy>=1.15,<2",
  "statsmodels>=0.14.4,<0.15",
  "waitress>=3,<4",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "beautifulsoup4>=4.13,<5",
  "coverage>=7.6,<8",
  "pyinstaller>=6.20,<7",
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gabay.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.coverage.run]
branch = true
source = ["forecasting", "portal", "prices"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
